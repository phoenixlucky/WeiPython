[package]
name = "wj-python-manager"
version = "3.2.0"
description = "WJ Python管理大师 local Python environment manager"
authors = ["尉缭子科技"]
edition = "2021"

[lib]
name = "weipython_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "process", "macros", "rt-multi-thread", "sync", "io-util", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
